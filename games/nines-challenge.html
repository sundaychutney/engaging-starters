<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nine's Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalkboard: #24402f;
    --chalkboard-dark: #172c20;
    --chalk-white: #ece7d6;
    --chalk-dim: #b9c2ac;
    --paper: #fbf8ef;
    --paper-line: #ddd3ae;
    --ink: #2b2b28;
    --ink-soft: #6b6355;
    --wood: #6b4a34;
    --focus: #8fb8d6;
    --gold: #e3b23c;
    --gold-dark: #93701f;
    --hard: #c1594a;
    --hard-dark: #7c3527;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--chalkboard);
    color: var(--chalk-white);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.03), transparent 60%);
    padding: 28px 16px 60px;
  }

  .board {
    max-width: 920px;
    margin: 0 auto;
    border: 10px solid var(--wood);
    border-radius: 14px;
    padding: 36px 32px 44px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 0 60px rgba(0,0,0,0.25);
    background: var(--chalkboard);
  }

  .back-link {
    display: inline-block;
    font-family: 'Caveat', cursive;
    font-size: 1.15rem;
    color: var(--chalk-dim);
    text-decoration: none;
    margin-bottom: 8px;
    transition: color 0.15s ease;
  }
  .back-link:hover, .back-link:focus-visible { color: var(--chalk-white); }

  header { text-align: center; margin-bottom: 30px; }

  header h1 {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(2.6rem, 6vw, 4rem);
    margin: 0;
    color: var(--chalk-white);
    text-shadow: 0 0 1px rgba(236,231,214,0.4);
    letter-spacing: 0.5px;
  }

  header p {
    font-family: 'Caveat', cursive;
    font-size: 1.35rem;
    color: var(--chalk-dim);
    margin: 4px 0 0;
  }

  /* ---- control panel ---- */
  .panel {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    max-width: 640px;
    margin: 0 auto;
    padding: 26px 28px 22px;
    position: relative;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  }

  .panel::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 26px;
    background: #c7bfa3;
    border-radius: 3px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
  }

  .panel::after {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #8a8266;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
  }

  .field label {
    display: block;
    text-align: center;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .segmented {
    display: flex;
    justify-content: center;
    border: 1.5px solid var(--paper-line);
    border-radius: 6px;
    overflow: hidden;
    width: fit-content;
    margin: 0 auto;
  }
  .segmented button {
    font-family: 'Space Mono', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 9px 15px;
    border: none;
    background: #fffdf7;
    color: var(--ink-soft);
    cursor: pointer;
    min-width: 40px;
  }
  .segmented button + button { border-left: 1.5px solid var(--paper-line); }
  .segmented button.active { background: var(--ink); color: var(--paper); }

  .tiles-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 22px 0 4px;
  }

  .tile {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1.5rem;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--ink);
    border-radius: 9px;
    background: var(--gold);
    border-color: var(--gold-dark);
    color: var(--gold-dark);
  }

  .helper-msg {
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 16px 0 16px;
  }

  .new-btn {
    display: block;
    margin: 0 auto;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.03em;
    padding: 9px 26px;
    border: none;
    border-radius: 6px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .new-btn:hover { transform: translateY(-1px); }
  .new-btn.hidden { display: none; }

  /* ---- challenge grid ---- */
  .results { margin-top: 40px; }

  .summary {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 1.5rem;
    color: var(--chalk-white);
    margin-bottom: 22px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
  }

  .num-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 16px 14px 14px;
    text-align: center;
    box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent, transparent 27px,
      var(--paper-line) 28px
    );
  }

  .num-card .target {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 2rem;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .reveal-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: 1.3px dashed var(--ink-soft);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .reveal-btn:hover { color: var(--ink); border-color: var(--ink); }

  .answer {
    display: none;
    margin-top: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.74rem;
    color: var(--ink);
    line-height: 1.6;
    text-align: left;
  }

  .num-card.revealed .answer { display: block; }
  .num-card.revealed .reveal-btn { display: none; }

  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 0.78rem;
    margin-top: 34px;
  }

  @media (max-width: 560px) {
    .board { padding: 24px 16px 34px; }
  }
</style>
</head>
<body>

<div class="board">
  <a class="back-link" href="../index.html">&larr; All activities</a>
  <header>
    <h1>Nine's Challenge</h1>
    <p>four of the same digit, every basic operation — how many numbers can you make?</p>
  </header>

  <div class="panel">
    <div class="field">
      <label>Pick a digit</label>
      <div class="segmented" id="digitToggle">
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4" class="active">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
      </div>
    </div>

    <div class="tiles-row" id="tilesRow"></div>
    <div class="helper-msg" id="helperMsg"></div>
    <button type="button" class="new-btn" id="newBtn">New challenge</button>
  </div>

  <div class="results">
    <div class="summary" id="summary"></div>
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <footer>Use +, −, ×, ÷ and brackets. You must use the digit exactly four times in every number you make.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- solver ----------------
     Finds every distinct positive whole number reachable by combining four
     copies of a digit with +, -, x, / (using all four every time), keeping
     one worked example per number. The search space is tiny (four numbers,
     a handful of ops) so this runs instantly. */
  function solveAll(digit){
    const results = new Map();

    function combine(list){
      if(list.length===1){
        const v = list[0].value;
        if(v>0 && !results.has(v)){ results.set(v, list[0].steps); }
        return;
      }
      for(let i=0;i<list.length;i++){
        for(let j=i+1;j<list.length;j++){
          const a=list[i], b=list[j];
          const rest = list.filter((_,k)=>k!==i && k!==j);
          const candidates = [];
          candidates.push({ value:a.value+b.value, line:`${a.value} + ${b.value} = ${a.value+b.value}` });
          candidates.push({ value:a.value*b.value, line:`${a.value} × ${b.value} = ${a.value*b.value}` });
          if(a.value>b.value){ candidates.push({ value:a.value-b.value, line:`${a.value} − ${b.value} = ${a.value-b.value}` }); }
          if(b.value>a.value){ candidates.push({ value:b.value-a.value, line:`${b.value} − ${a.value} = ${b.value-a.value}` }); }
          if(b.value!==0 && a.value%b.value===0){ candidates.push({ value:a.value/b.value, line:`${a.value} ÷ ${b.value} = ${a.value/b.value}` }); }
          if(a.value!==0 && b.value%a.value===0){ candidates.push({ value:b.value/a.value, line:`${b.value} ÷ ${a.value} = ${b.value/a.value}` }); }

          for(const c of candidates){
            const node = { value:c.value, steps:a.steps.concat(b.steps).concat([c.line]) };
            combine(rest.concat([node]));
          }
        }
      }
    }

    combine([digit,digit,digit,digit].map(n=>({ value:n, steps:[] })));
    return results;
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  /* ---------------- UI wiring ---------------- */
  const digitToggle = document.getElementById('digitToggle');
  const tilesRow = document.getElementById('tilesRow');
  const helperMsg = document.getElementById('helperMsg');
  const newBtn = document.getElementById('newBtn');
  const summary = document.getElementById('summary');
  const cardGrid = document.getElementById('cardGrid');

  const MAX_SHOWN = 10;
  const cache = {};
  let digit = 4;

  function poolFor(d){
    if(!cache[d]) cache[d] = solveAll(d);
    return cache[d];
  }

  function renderRound(){
    const pool = poolFor(digit);
    const allValues = Array.from(pool.keys()).sort((a,b)=>a-b);
    const showAll = allValues.length <= MAX_SHOWN;
    const shown = (showAll ? allValues : shuffle(allValues.slice()).slice(0, MAX_SHOWN)).sort((a,b)=>a-b);

    tilesRow.innerHTML = `${digit},${digit},${digit},${digit}`.split(',').map(n=>`<span class="tile">${n}</span>`).join('');
    helperMsg.textContent = `There ${allValues.length===1?'is':'are'} ${allValues.length} number${allValues.length===1?'':'s'} possible using four ${digit}s.`;
    newBtn.classList.toggle('hidden', showAll);

    summary.textContent = showAll
      ? `Find all ${allValues.length} of them!`
      : `Here are ${MAX_SHOWN} to try (there are ${allValues.length} in total).`;

    cardGrid.innerHTML = '';
    shown.forEach(value=>{
      const steps = pool.get(value);
      const card = document.createElement('div');
      card.className = 'num-card';
      card.innerHTML = `
        <div class="target">${value}</div>
        <button type="button" class="reveal-btn">Reveal answer</button>
        <div class="answer">${steps.join('<br/>')}</div>
      `;
      card.querySelector('.reveal-btn').addEventListener('click', ()=>{
        card.classList.add('revealed');
      });
      cardGrid.appendChild(card);
    });
  }

  digitToggle.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    Array.from(digitToggle.children).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    digit = Number(btn.dataset.digit);
    renderRound();
  });

  newBtn.addEventListener('click', renderRound);

  renderRound();

})();
</script>

</body>
</html>
