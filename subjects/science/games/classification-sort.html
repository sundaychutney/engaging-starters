<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classification Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css">
<style>
  .board { max-width: 640px; }

  .panel {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    margin: 0 auto;
    padding: 26px 28px 22px;
    position: relative;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
    text-align: center;
  }
  .panel::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 26px;
    background: #c7bfa3;
    border-radius: 3px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
  }
  .panel::after {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #8a8266;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
  }

  .field label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .segmented {
    display: inline-flex;
    justify-content: center;
    border: 1.5px solid var(--paper-line);
    border-radius: 6px;
    overflow: hidden;
  }
  .segmented button {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 9px 14px;
    border: none;
    background: #fffdf7;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .segmented button + button { border-left: 1.5px solid var(--paper-line); }
  .segmented button.active { background: var(--ink); color: var(--paper); }

  .new-btn {
    display: block;
    margin: 18px auto 0;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.4rem;
    padding: 9px 26px;
    border: none;
    border-radius: 6px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }
  .new-btn:hover { transform: translateY(-1px); }

  .stat-row {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1.5px dashed var(--paper-line);
    font-family: 'Space Mono', monospace;
  }
  .stat { text-align: center; }
  .stat .n { font-size: 1.5rem; font-weight: 700; color: var(--ink); }
  .stat .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .stat.timer .n.ticking { color: var(--hard-dark); }
  .stat.timer .n.done { color: var(--hard); }

  .game-wrap { margin-top: 34px; text-align: center; }
  .organism-name {
    font-family: 'Caveat', cursive;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--chalk-white);
    min-height: 1.3em;
  }
  .group-btns {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
  }
  .group-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 12px 20px;
    border: 2px solid var(--chalk-dim);
    border-radius: 8px;
    background: transparent;
    color: var(--chalk-white);
    cursor: pointer;
    transition: transform 0.06s ease;
  }
  .group-btn:hover:not(:disabled) { transform: translateY(-2px); background: rgba(236,231,214,0.08); }
  .group-btn:disabled { cursor: default; }
  .group-btn.correct { background: var(--easy); border-color: var(--easy-dark); color: var(--easy-dark); }
  .group-btn.wrong { background: var(--hard); border-color: var(--hard-dark); color: #fff; }

  .feedback {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--chalk-dim);
    min-height: 1.2em;
  }

  .over-banner {
    display: none;
    margin-top: 20px;
    font-family: 'Caveat', cursive;
    font-size: 1.8rem;
    color: var(--chalk-white);
  }
  .over-banner.show { display: block; }

  @media (max-width: 560px) { .board { padding: 24px 16px 34px; } }
</style>
</head>
<body>

<div class="board">
  <a class="back-link" href="../index.html">&larr; All Science activities</a>
  <header>
    <h1>Classification Sort</h1>
    <p>lightning round — sort each organism before time's up</p>
  </header>

  <div class="panel">
    <div class="field">
      <label>Classification scheme</label>
      <div class="segmented" id="schemeToggle">
        <button type="button" data-scheme="simple">Vertebrate / Invertebrate</button>
        <button type="button" data-scheme="full" class="active">Animal groups</button>
      </div>
    </div>
    <button type="button" class="new-btn" id="newBtn">Start round (60s)</button>

    <div class="stat-row">
      <div class="stat"><div class="n" id="scoreStat">0</div><div class="label">Correct</div></div>
      <div class="stat"><div class="n" id="streakStat">0</div><div class="label">Streak</div></div>
      <div class="stat timer"><div class="n" id="timerStat">60</div><div class="label">Seconds</div></div>
    </div>
  </div>

  <div class="game-wrap">
    <div class="organism-name" id="organismName">Press start to begin</div>
    <div class="group-btns" id="groupBtns"></div>
    <div class="feedback" id="feedback"></div>
    <div class="over-banner" id="overBanner"></div>
  </div>

  <footer>Vertebrates have a backbone (mammal, bird, reptile, amphibian, fish). Invertebrates don't.</footer>
</div>

<script>
(function(){
  "use strict";

  const ORGANISMS = [
    {name:"Kangaroo", group:"Mammal"}, {name:"Elephant", group:"Mammal"}, {name:"Dolphin", group:"Mammal"},
    {name:"Bat", group:"Mammal"}, {name:"Platypus", group:"Mammal"}, {name:"Koala", group:"Mammal"},
    {name:"Whale", group:"Mammal"}, {name:"Lion", group:"Mammal"}, {name:"Mouse", group:"Mammal"},
    {name:"Eagle", group:"Bird"}, {name:"Penguin", group:"Bird"}, {name:"Ostrich", group:"Bird"},
    {name:"Kookaburra", group:"Bird"}, {name:"Owl", group:"Bird"}, {name:"Flamingo", group:"Bird"}, {name:"Emu", group:"Bird"},
    {name:"Crocodile", group:"Reptile"}, {name:"Snake", group:"Reptile"}, {name:"Turtle", group:"Reptile"},
    {name:"Lizard", group:"Reptile"}, {name:"Gecko", group:"Reptile"}, {name:"Komodo dragon", group:"Reptile"},
    {name:"Frog", group:"Amphibian"}, {name:"Toad", group:"Amphibian"}, {name:"Salamander", group:"Amphibian"}, {name:"Newt", group:"Amphibian"},
    {name:"Shark", group:"Fish"}, {name:"Salmon", group:"Fish"}, {name:"Clownfish", group:"Fish"},
    {name:"Seahorse", group:"Fish"}, {name:"Eel", group:"Fish"},
    {name:"Octopus", group:"Invertebrate"}, {name:"Spider", group:"Invertebrate"}, {name:"Bee", group:"Invertebrate"},
    {name:"Jellyfish", group:"Invertebrate"}, {name:"Snail", group:"Invertebrate"}, {name:"Ant", group:"Invertebrate"},
    {name:"Butterfly", group:"Invertebrate"}, {name:"Crab", group:"Invertebrate"}, {name:"Starfish", group:"Invertebrate"}, {name:"Worm", group:"Invertebrate"}
  ];

  const VERTEBRATE_GROUPS = ["Mammal","Bird","Reptile","Amphibian","Fish"];

  function simpleGroup(g){ return VERTEBRATE_GROUPS.includes(g) ? "Vertebrate" : "Invertebrate"; }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  const schemeToggle = document.getElementById('schemeToggle');
  const newBtn = document.getElementById('newBtn');
  const scoreStat = document.getElementById('scoreStat');
  const streakStat = document.getElementById('streakStat');
  const timerStat = document.getElementById('timerStat');
  const organismName = document.getElementById('organismName');
  const groupBtns = document.getElementById('groupBtns');
  const feedback = document.getElementById('feedback');
  const overBanner = document.getElementById('overBanner');

  let scheme = 'full';
  let queue = [];
  let score = 0, streak = 0, bestStreak = 0;
  let intervalId = null;
  let running = false;
  const TIMER_LEN = 60;

  function groupsForScheme(){
    return scheme === 'simple' ? ["Vertebrate","Invertebrate"] : ["Mammal","Bird","Reptile","Amphibian","Fish","Invertebrate"];
  }
  function correctGroupFor(o){
    return scheme === 'simple' ? simpleGroup(o.group) : o.group;
  }

  function renderButtons(){
    const groups = groupsForScheme();
    groupBtns.innerHTML = groups.map(g=>`<button type="button" class="group-btn" data-g="${g}">${g}</button>`).join('');
    Array.from(groupBtns.children).forEach(btn=>{
      btn.addEventListener('click', ()=> answer(btn));
    });
  }

  function nextOrganism(){
    if(!queue.length) queue = shuffle(ORGANISMS);
    const o = queue.pop();
    organismName.textContent = o.name;
    organismName.dataset.answer = correctGroupFor(o);
    Array.from(groupBtns.children).forEach(b=>{
      b.disabled = false;
      b.classList.remove('correct','wrong');
    });
  }

  function answer(btn){
    if(!running) return;
    const correct = organismName.dataset.answer;
    Array.from(groupBtns.children).forEach(b=> b.disabled = true);
    if(btn.dataset.g === correct){
      btn.classList.add('correct');
      score++; streak++;
      bestStreak = Math.max(bestStreak, streak);
      feedback.textContent = 'Correct!';
    } else {
      btn.classList.add('wrong');
      const correctBtn = Array.from(groupBtns.children).find(b=>b.dataset.g===correct);
      if(correctBtn) correctBtn.classList.add('correct');
      streak = 0;
      feedback.textContent = `That's a ${correct.toLowerCase()}.`;
    }
    scoreStat.textContent = score;
    streakStat.textContent = streak;
    setTimeout(()=>{ if(running) nextOrganism(); }, 550);
  }

  function endRound(){
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    Array.from(groupBtns.children).forEach(b=> b.disabled = true);
    organismName.textContent = "Time's up!";
    overBanner.textContent = `Final score: ${score} correct (best streak ${bestStreak})`;
    overBanner.classList.add('show');
  }

  function tick(){
    let s = Number(timerStat.dataset.seconds) - 1;
    timerStat.dataset.seconds = String(s);
    timerStat.textContent = String(s);
    if(s<=10 && s>0){ timerStat.classList.add('ticking'); }
    if(s<=0){
      timerStat.textContent = '0';
      timerStat.classList.remove('ticking');
      timerStat.classList.add('done');
      endRound();
    }
  }

  function startRound(){
    score = 0; streak = 0; bestStreak = 0;
    scoreStat.textContent = '0';
    streakStat.textContent = '0';
    timerStat.textContent = String(TIMER_LEN);
    timerStat.dataset.seconds = String(TIMER_LEN);
    timerStat.classList.remove('ticking','done');
    feedback.textContent = '';
    overBanner.classList.remove('show');
    overBanner.textContent = '';
    queue = shuffle(ORGANISMS);
    running = true;
    renderButtons();
    nextOrganism();
    clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
  }

  schemeToggle.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    Array.from(schemeToggle.children).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    scheme = btn.dataset.scheme;
    if(running) startRound();
  });

  newBtn.addEventListener('click', startRound);

  renderButtons();

})();
</script>

</body>
</html>
