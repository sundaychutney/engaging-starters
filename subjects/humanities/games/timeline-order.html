<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timeline Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css">
<link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<style>
  .board { max-width: 760px; }

  .panel {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 18px;
    margin: 0 auto;
    padding: 26px 28px 22px;
    position: relative;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
    text-align: center;
  }

  .field label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .segmented {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    border: 1.5px solid var(--paper-line);
    border-radius: 6px;
    overflow: hidden;
  }
  .segmented button {
    font-family: 'Karla', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 9px 14px;
    border: none;
    background: #fffdf7;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .segmented button + button { border-left: 1.5px solid var(--paper-line); }
  .segmented button.active { background: var(--ink); color: var(--paper); }

  .instructions { font-size: 0.85rem; color: var(--ink-soft); margin-top: 16px; }

  .zone-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 18px 0 8px;
    text-align: left;
  }

  .event-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 50px;
    padding: 10px;
    border: 1.5px dashed var(--paper-line);
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .event-tile {
    font-family: 'Karla', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 10px 14px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    background: #fffefa;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: transform 0.06s ease;
  }
  .event-tile:hover { transform: translateX(2px); }
  .event-tile.placed { background: var(--gold); border-color: var(--gold-dark); color: var(--gold-dark); }
  .event-tile .num { font-family: 'Space Mono', monospace; margin-right: 8px; }

  .btn-row { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .action-btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 8px 22px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
  }
  .action-btn:hover:not(:disabled) { transform: translateY(-1px); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ghost-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: 1.3px dashed var(--ink-soft);
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .ghost-btn:hover { color: var(--ink); border-color: var(--ink); }

  .result-msg { margin-top: 12px; font-size: 0.88rem; color: var(--ink-soft); min-height: 1.2em; }
  .result-msg.correct { color: var(--gold-dark); font-weight: 700; }

  .reveal-box {
    display: none;
    margin-top: 16px;
    text-align: left;
    border-top: 1.5px dashed var(--paper-line);
    padding-top: 14px;
  }
  .reveal-box.show { display: block; }
  .reveal-row {
    display: flex;
    gap: 12px;
    font-size: 0.85rem;
    padding: 4px 0;
  }
  .reveal-row .year { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--gold-dark); min-width: 70px; }

  .toolbar { display: flex; justify-content: center; margin-top: 30px; }
  .new-btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 9px 26px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
  }
  .new-btn:hover { transform: translateY(-1px); }

  @media (max-width: 560px) { .board { padding: 24px 16px 34px; } }
</style>
</head>
<body>

<div class="board">
  <a class="back-link" href="../index.html">&larr; All Humanities activities</a>
  <header>
    <h1>Timeline Order</h1>
    <p>click the events into chronological order, earliest first</p>
  </header>

  <div class="panel">
    <div class="field">
      <label>Event set</label>
      <div class="segmented" id="setToggle">
        <button type="button" data-set="0" class="active">World milestones</button>
        <button type="button" data-set="1">Ancient civilisations</button>
        <button type="button" data-set="2">Australian history</button>
        <button type="button" data-set="3">Inventions &amp; technology</button>
      </div>
    </div>

    <div class="instructions">Click each event below, earliest first, to build your timeline.</div>

    <div class="zone-label">Your timeline (earliest &rarr; latest)</div>
    <div class="event-col" id="answerCol"></div>

    <div class="zone-label">Click to add</div>
    <div class="event-col" id="poolCol"></div>

    <div class="btn-row">
      <button type="button" class="action-btn" id="checkBtn">Check my order</button>
      <button type="button" class="ghost-btn" id="resetBtn">Reset</button>
      <button type="button" class="ghost-btn" id="revealBtn">Reveal answer</button>
    </div>

    <div class="result-msg" id="resultMsg"></div>
    <div class="reveal-box" id="revealBox"></div>
  </div>

  <div class="toolbar">
    <button type="button" class="new-btn" id="newBtn">Shuffle again</button>
  </div>

  <footer>Build the timeline from earliest to most recent, then check your order.</footer>
</div>

<script>
(function(){
  "use strict";

  const SETS = [
    { name:"World milestones", events:[
      { text:"Invention of the printing press (Gutenberg)", year:"c. 1440" },
      { text:"Columbus's expedition reaches the Americas", year:"1492" },
      { text:"French Revolution begins", year:"1789" },
      { text:"First powered flight (Wright brothers)", year:"1903" },
      { text:"World War II ends", year:"1945" },
      { text:"First Moon landing", year:"1969" }
    ]},
    { name:"Ancient civilisations", events:[
      { text:"Great Pyramid of Giza built", year:"c. 2560 BCE" },
      { text:"Traditional founding of Rome", year:"753 BCE" },
      { text:"Qin dynasty unifies the Great Wall of China", year:"221 BCE" },
      { text:"Julius Caesar assassinated", year:"44 BCE" },
      { text:"Fall of the Western Roman Empire", year:"476 CE" }
    ]},
    { name:"Australian history", events:[
      { text:"James Cook charts Australia's east coast", year:"1770" },
      { text:"First Fleet arrives at Sydney Cove", year:"1788" },
      { text:"Eureka Stockade rebellion", year:"1854" },
      { text:"Federation of Australia", year:"1901" },
      { text:"Commonwealth Franchise Act (federal women's suffrage)", year:"1902" },
      { text:"ANZAC troops land at Gallipoli", year:"1915" }
    ]},
    { name:"Inventions & technology", events:[
      { text:"Invention of the wheel", year:"c. 3500 BCE" },
      { text:"Invention of the printing press", year:"c. 1440" },
      { text:"Invention of the telephone (Alexander Graham Bell)", year:"1876" },
      { text:"Invention of the World Wide Web (Tim Berners-Lee)", year:"1989" },
      { text:"Launch of the first iPhone", year:"2007" }
    ]}
  ];

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  const setToggle = document.getElementById('setToggle');
  const answerCol = document.getElementById('answerCol');
  const poolCol = document.getElementById('poolCol');
  const checkBtn = document.getElementById('checkBtn');
  const resetBtn = document.getElementById('resetBtn');
  const revealBtn = document.getElementById('revealBtn');
  const resultMsg = document.getElementById('resultMsg');
  const revealBox = document.getElementById('revealBox');
  const newBtn = document.getElementById('newBtn');

  let setIndex = 0;
  let placed = [];
  let pool = [];
  let done = false;

  function render(){
    const correctOrder = SETS[setIndex].events;
    answerCol.innerHTML = placed.length
      ? placed.map((ev,i)=>`<span class="event-tile placed" data-idx="${i}"><span class="num">${i+1}.</span>${ev.text}</span>`).join('')
      : '<span style="color:var(--ink-soft);font-size:0.85rem;">(click events below to build your timeline)</span>';

    poolCol.innerHTML = pool.map((ev,i)=>`<span class="event-tile" data-idx="${i}">${ev.text}</span>`).join('');

    checkBtn.disabled = done || placed.length !== correctOrder.length;

    Array.from(answerCol.querySelectorAll('.event-tile')).forEach(el=>{
      el.addEventListener('click', ()=>{
        if(done) return;
        const idx = Number(el.dataset.idx);
        pool.push(placed[idx]);
        placed.splice(idx,1);
        render();
      });
    });
    Array.from(poolCol.querySelectorAll('.event-tile')).forEach(el=>{
      el.addEventListener('click', ()=>{
        if(done) return;
        const idx = Number(el.dataset.idx);
        placed.push(pool[idx]);
        pool.splice(idx,1);
        render();
      });
    });
  }

  function showReveal(){
    revealBox.innerHTML = SETS[setIndex].events.map(ev=>
      `<div class="reveal-row"><span class="year">${ev.year}</span><span>${ev.text}</span></div>`
    ).join('');
    revealBox.classList.add('show');
  }

  function check(){
    const correctOrder = SETS[setIndex].events;
    if(placed.length !== correctOrder.length) return;
    let correct = 0;
    for(let i=0;i<correctOrder.length;i++){
      if(placed[i].text === correctOrder[i].text) correct++;
    }
    if(correct === correctOrder.length){
      done = true;
      resultMsg.textContent = `Correct! That's the timeline in order.`;
      resultMsg.classList.add('correct');
      showReveal();
    } else {
      resultMsg.textContent = `${correct} of ${correctOrder.length} in the right spot. Try again, or reveal the answer.`;
      resultMsg.classList.remove('correct');
    }
  }

  function startRound(){
    placed = [];
    pool = shuffle(SETS[setIndex].events);
    done = false;
    resultMsg.textContent = '';
    resultMsg.classList.remove('correct');
    revealBox.classList.remove('show');
    revealBox.innerHTML = '';
    render();
  }

  checkBtn.addEventListener('click', check);
  resetBtn.addEventListener('click', ()=>{
    if(done) return;
    pool = shuffle(placed.concat(pool));
    placed = [];
    render();
  });
  revealBtn.addEventListener('click', ()=>{
    done = true;
    render();
    if(!resultMsg.classList.contains('correct')){
      resultMsg.textContent = "Here's the correct order:";
    }
    showReveal();
  });
  newBtn.addEventListener('click', startRound);

  setToggle.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    Array.from(setToggle.children).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    setIndex = Number(btn.dataset.set);
    startRound();
  });

  startRound();

})();
</script>

</body>
</html>
