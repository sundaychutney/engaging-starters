<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flag Guess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css">
<style>
  .board { max-width: 640px; }

  .stat-row {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin-bottom: 26px;
    font-family: 'Space Mono', monospace;
  }
  .stat { text-align: center; }
  .stat .n { font-size: 1.6rem; font-weight: 700; color: var(--ink); }
  .stat .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .stat.timer .n.ticking { color: var(--hard-dark); }
  .stat.timer .n.done { color: var(--hard); }

  .flag-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 24px;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
  }
  .flag-card img {
    max-width: 260px;
    width: 100%;
    height: auto;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    box-shadow: 0 2px 6px rgba(36,27,24,0.12);
  }
  .flag-card .placeholder { font-family: 'Karla', sans-serif; color: var(--ink-soft); font-size: 0.9rem; }

  .option-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 22px;
  }
  .opt-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    padding: 14px 12px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.06s ease, border-color 0.12s ease;
  }
  .opt-btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--humanities); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { background: var(--easy); border-color: var(--easy-dark); color: var(--easy-dark); }
  .opt-btn.wrong { background: var(--hard); border-color: var(--hard-dark); color: #fff; }

  .feedback { margin-top: 16px; text-align: center; font-size: 0.85rem; color: var(--ink-soft); min-height: 2.4em; padding: 0 10px; }

  .toolbar { display: flex; justify-content: center; margin-top: 24px; }
  .new-btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 9px 26px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
  }
  .new-btn:hover { transform: translateY(-1px); }
  .new-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .over-banner {
    display: none;
    margin-top: 20px;
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 1.45rem;
    color: var(--ink);
  }
  .over-banner.show { display: block; }

  @media (max-width: 560px) {
    .board { padding: 24px 16px 34px; }
    .option-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="board">
  <a class="back-link" href="../index.html">&larr; All Humanities activities</a>
  <header>
    <h1>Flag Guess</h1>
    <p>which country does this flag belong to?</p>
  </header>

  <div class="stat-row">
    <div class="stat"><div class="n" id="scoreStat">0</div><div class="label">Correct</div></div>
    <div class="stat"><div class="n" id="totalStat">0</div><div class="label">Attempted</div></div>
    <div class="stat timer"><div class="n" id="timerStat">60</div><div class="label">Seconds</div></div>
  </div>

  <div class="flag-card" id="flagCard"><span class="placeholder">Press start to begin</span></div>

  <div class="option-grid" id="optionGrid"></div>

  <div class="feedback" id="feedback"></div>
  <div class="over-banner" id="overBanner"></div>

  <div class="toolbar">
    <button type="button" class="new-btn" id="newBtn" disabled>Loading countries…</button>
  </div>

  <footer>191 countries, sourced from flag-icons (MIT licensed). How many flags can you place in 60 seconds?</footer>
</div>

<script>
(function(){
  "use strict";

  const DATA_URL = '../../../assets/data/countries.json';
  const FLAG_PATH = '../../../assets/images/humanities/flags/';

  const flagCard = document.getElementById('flagCard');
  const optionGrid = document.getElementById('optionGrid');
  const feedback = document.getElementById('feedback');
  const scoreStat = document.getElementById('scoreStat');
  const totalStat = document.getElementById('totalStat');
  const timerStat = document.getElementById('timerStat');
  const overBanner = document.getElementById('overBanner');
  const newBtn = document.getElementById('newBtn');

  let countries = [];
  let queue = [];
  let current = null;
  let score = 0, total = 0;
  let running = false;
  let intervalId = null;
  const TIMER_LEN = 60;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function pickOptions(correct){
    const sameRegion = countries.filter(c => c.code !== correct.code && c.region === correct.region);
    const rest = countries.filter(c => c.code !== correct.code && c.region !== correct.region);
    const distractors = shuffle(sameRegion).slice(0, 3);
    if(distractors.length < 3){
      distractors.push(...shuffle(rest).slice(0, 3 - distractors.length));
    }
    return shuffle([correct, ...distractors]);
  }

  function nextRound(){
    if(!queue.length) queue = shuffle(countries);
    current = queue.pop();
    flagCard.innerHTML = `<img src="${FLAG_PATH}${current.code}.svg" alt="Flag to identify" draggable="false">`;
    feedback.textContent = '';
    const options = pickOptions(current);
    optionGrid.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt-btn';
      btn.textContent = opt.name;
      btn.dataset.code = opt.code;
      btn.addEventListener('click', () => answer(btn));
      optionGrid.appendChild(btn);
    });
  }

  function answer(btn){
    if(!running) return;
    total++;
    totalStat.textContent = total;
    Array.from(optionGrid.children).forEach(b => b.disabled = true);
    if(btn.dataset.code === current.code){
      btn.classList.add('correct');
      score++;
      scoreStat.textContent = score;
      feedback.textContent = `Correct — that's ${current.name}.`;
    } else {
      btn.classList.add('wrong');
      const correctBtn = Array.from(optionGrid.children).find(b => b.dataset.code === current.code);
      if(correctBtn) correctBtn.classList.add('correct');
      feedback.textContent = `That was ${current.name}.`;
    }
    setTimeout(()=>{ if(running) nextRound(); }, 1200);
  }

  function endRound(){
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    Array.from(optionGrid.children).forEach(b => b.disabled = true);
    flagCard.innerHTML = `<span class="placeholder">Time's up!</span>`;
    feedback.textContent = '';
    overBanner.textContent = `Final score: ${score} of ${total} correct.`;
    overBanner.classList.add('show');
    newBtn.disabled = false;
    newBtn.textContent = 'Play again (60s)';
  }

  function tick(){
    let s = Number(timerStat.dataset.seconds) - 1;
    timerStat.dataset.seconds = String(s);
    timerStat.textContent = String(s);
    if(s<=10 && s>0){ timerStat.classList.add('ticking'); }
    if(s<=0){
      timerStat.textContent = '0';
      timerStat.classList.remove('ticking');
      timerStat.classList.add('done');
      endRound();
    }
  }

  function startRound(){
    score = 0; total = 0;
    scoreStat.textContent = '0';
    totalStat.textContent = '0';
    timerStat.textContent = String(TIMER_LEN);
    timerStat.dataset.seconds = String(TIMER_LEN);
    timerStat.classList.remove('ticking','done');
    overBanner.classList.remove('show');
    overBanner.textContent = '';
    newBtn.disabled = true;
    queue = shuffle(countries);
    running = true;
    nextRound();
    clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
  }

  newBtn.addEventListener('click', startRound);

  fetch(DATA_URL)
    .then(r => r.json())
    .then(data => {
      countries = data;
      newBtn.disabled = false;
      newBtn.textContent = 'Start round (60s)';
    })
    .catch(() => {
      flagCard.innerHTML = `<span class="placeholder">Couldn't load country data.</span>`;
    });

})();
</script>

</body>
</html>
