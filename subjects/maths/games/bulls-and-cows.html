<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bulls and Cows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css">
<link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<style>
  .panel {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 18px;
    margin: 0 auto;
    padding: 26px 28px 22px;
    position: relative;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
    text-align: center;
  }

  .field label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .segmented {
    display: inline-flex;
    justify-content: center;
    border: 1.5px solid var(--paper-line);
    border-radius: 6px;
    overflow: hidden;
  }
  .segmented button {
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 9px 16px;
    border: none;
    background: #fffdf7;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .segmented button + button { border-left: 1.5px solid var(--paper-line); }
  .segmented button.active { background: var(--ink); color: var(--paper); }

  .new-btn {
    display: block;
    margin: 18px auto 0;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 26px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .new-btn:hover { transform: translateY(-1px); }

  /* ---- game ---- */
  .game-wrap { margin-top: 34px; }

  .game {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 22px 26px;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
  }

  .rules-line {
    text-align: center;
    font-family: 'Karla', sans-serif;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .digit-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .digit-box {
    width: 46px;
    height: 52px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1.6rem;
    text-align: center;
    border: 2px solid var(--ink);
    border-radius: 8px;
    background: #fffefa;
    color: var(--ink);
  }
  .digit-box:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(143,184,214,0.3);
  }

  .action-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .guess-btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 9px 24px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
  }
  .guess-btn:hover { transform: translateY(-1px); }
  .guess-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    text-align: center;
    font-size: 0.8rem;
    color: var(--hard-dark);
    min-height: 1.2em;
    margin-bottom: 10px;
  }

  .util-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .ghost-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: 1.3px dashed var(--ink-soft);
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .ghost-btn:hover { color: var(--ink); border-color: var(--ink); }

  .history {
    border-top: 1.5px dashed var(--paper-line);
    padding-top: 14px;
  }

  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    padding: 5px 4px;
  }
  .history-row:nth-child(odd) { background: rgba(0,0,0,0.03); }
  .history-row .guess-num { letter-spacing: 0.2em; }
  .history-row .score .bulls { color: var(--gold-dark); font-weight: 700; }
  .history-row .score .cows { color: var(--ink-soft); }

  .win-banner {
    display: none;
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.3rem;
    color: var(--gold-dark);
    margin-top: 14px;
  }
  .win-banner.show { display: block; }

  @media (max-width: 560px) {
    .board { padding: 24px 16px 34px; }
    .digit-box { width: 38px; height: 46px; font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="board">
  <a class="brand-lockup" href="../../../index.html">
    <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="18" fill="#ff4b3e"/>
      <rect x="26" y="6" width="12" height="8" rx="4" fill="#fff8f3"/>
      <circle cx="32" cy="35" r="19" fill="none" stroke="#fff8f3" stroke-width="4.5"/>
      <line x1="32" y1="35" x2="32" y2="23" stroke="#fff8f3" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="32" y1="35" x2="41" y2="35" stroke="#fff8f3" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
    <span class="brand-wordmark"><span class="a">Engaging</span> <span class="b">Starters</span></span>
  </a>
  <a class="back-link" href="../index.html">&larr; All activities</a>
  <header>
    <h1>Bulls and Cows</h1>
    <p>guess the secret number, one clue at a time</p>
  </header>

  <div class="panel">
    <div class="field">
      <label>How many digits</label>
      <div class="segmented" id="lengthToggle">
        <button type="button" data-len="3">3</button>
        <button type="button" data-len="4" class="active">4</button>
        <button type="button" data-len="5">5</button>
      </div>
    </div>
    <button type="button" class="new-btn" id="newBtn">New secret number</button>
  </div>

  <div class="game-wrap">
    <div class="game">
      <div class="rules-line" id="rulesLine"></div>
      <div class="digit-row" id="digitRow"></div>
      <div class="action-row">
        <button type="button" class="guess-btn" id="guessBtn">Guess</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <div class="util-row">
        <button type="button" class="ghost-btn" id="giveUpBtn">Reveal the number</button>
      </div>
      <div class="win-banner" id="winBanner"></div>
      <div class="history" id="history"></div>
    </div>
  </div>

  <footer><span class="score"><span class="bulls">Bull</span> = right digit, right spot.</span> <span class="score"><span class="cows">Cow</span> = right digit, wrong spot.</span> No repeated digits, in the secret or in your guess.</footer>
</div>

<script>
(function(){
  "use strict";

  function makeSecret(len){
    const digits = ['1','2','3','4','5','6','7','8','9']; // no leading zero
    const first = digits.splice(Math.floor(Math.random()*digits.length),1)[0];
    const rest = ['0'].concat(digits);
    const chosen = [first];
    while(chosen.length < len){
      const idx = Math.floor(Math.random()*rest.length);
      chosen.push(rest.splice(idx,1)[0]);
    }
    return chosen.join('');
  }

  function score(secret, guess){
    let bulls = 0, cows = 0;
    for(let i=0;i<secret.length;i++){
      if(guess[i]===secret[i]) bulls++;
      else if(secret.includes(guess[i])) cows++;
    }
    return { bulls, cows };
  }

  /* ---------------- UI wiring ---------------- */
  const lengthToggle = document.getElementById('lengthToggle');
  const newBtn = document.getElementById('newBtn');
  const rulesLine = document.getElementById('rulesLine');
  const digitRow = document.getElementById('digitRow');
  const guessBtn = document.getElementById('guessBtn');
  const errorMsg = document.getElementById('errorMsg');
  const giveUpBtn = document.getElementById('giveUpBtn');
  const winBanner = document.getElementById('winBanner');
  const history = document.getElementById('history');

  let length = 4;
  let secret = '';
  let guessCount = 0;
  let won = false;
  let boxes = [];

  function buildBoxes(){
    digitRow.innerHTML = '';
    boxes = [];
    for(let i=0;i<length;i++){
      const box = document.createElement('input');
      box.type = 'text';
      box.className = 'digit-box';
      box.maxLength = 1;
      box.inputMode = 'numeric';
      box.addEventListener('input', ()=>{
        box.value = box.value.replace(/[^0-9]/g,'');
        if(box.value && boxes[i+1]) boxes[i+1].focus();
      });
      box.addEventListener('keydown', (e)=>{
        if(e.key==='Backspace' && !box.value && boxes[i-1]) boxes[i-1].focus();
        if(e.key==='Enter') submitGuess();
      });
      boxes.push(box);
      digitRow.appendChild(box);
    }
  }

  function submitGuess(){
    if(won) return;
    const guess = boxes.map(b=>b.value).join('');
    errorMsg.textContent = '';
    if(guess.length !== length || boxes.some(b=>b.value==='')){
      errorMsg.textContent = `Enter all ${length} digits first.`;
      return;
    }
    if(new Set(guess.split('')).size !== length){
      errorMsg.textContent = 'No repeated digits allowed.';
      return;
    }
    guessCount++;
    const { bulls, cows } = score(secret, guess);
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `<span class="guess-num">${guess}</span><span class="score"><span class="bulls">${bulls} bull${bulls===1?'':'s'}</span> · <span class="cows">${cows} cow${cows===1?'':'s'}</span></span>`;
    history.insertBefore(row, history.firstChild);

    if(bulls === length){
      won = true;
      winBanner.textContent = `Solved it in ${guessCount} guess${guessCount===1?'':'es'}!`;
      winBanner.classList.add('show');
      guessBtn.disabled = true;
    } else {
      boxes.forEach(b=>{ b.value=''; });
      boxes[0].focus();
    }
  }

  function startGame(){
    secret = makeSecret(length);
    guessCount = 0;
    won = false;
    winBanner.classList.remove('show');
    winBanner.textContent = '';
    guessBtn.disabled = false;
    errorMsg.textContent = '';
    history.innerHTML = '';
    rulesLine.textContent = `I'm thinking of a ${length}-digit number with no repeated digits. Guess it!`;
    buildBoxes();
    boxes[0].focus();
  }

  lengthToggle.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    Array.from(lengthToggle.children).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    length = Number(btn.dataset.len);
    startGame();
  });

  newBtn.addEventListener('click', startGame);
  guessBtn.addEventListener('click', submitGuess);
  giveUpBtn.addEventListener('click', ()=>{
    if(!won){
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `<span class="guess-num">${secret}</span><span class="score">revealed</span>`;
      history.insertBefore(row, history.firstChild);
      won = true;
      guessBtn.disabled = true;
    }
  });

  startGame();

})();
</script>

</body>
</html>
