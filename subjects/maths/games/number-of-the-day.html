<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Number of the Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css">
<link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<style>
  .board { max-width: 920px; }

  /* ---- control panel ---- */
  .panel {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 18px;
    max-width: 640px;
    margin: 0 auto;
    padding: 26px 28px 22px;
    position: relative;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
    text-align: center;
  }

  .date-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 12px;
  }

  .tiles-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .tile {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1.5rem;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--ink);
    border-radius: 9px;
    background: var(--gold);
    border-color: var(--gold-dark);
    color: var(--gold-dark);
  }

  .field label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .segmented {
    display: inline-flex;
    justify-content: center;
    border: 1.5px solid var(--paper-line);
    border-radius: 6px;
    overflow: hidden;
  }
  .segmented button {
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 9px 16px;
    border: none;
    background: #fffdf7;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .segmented button + button { border-left: 1.5px solid var(--paper-line); }
  .segmented button.active { background: var(--ink); color: var(--paper); }

  /* ---- challenge grid ---- */
  .results { margin-top: 40px; }

  .summary {
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--chalk-white);
    margin-bottom: 22px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }

  .num-card {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 12px 12px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
  }

  .num-card .target {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1.8rem;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .reveal-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: 1.3px dashed var(--ink-soft);
    border-radius: 6px;
    padding: 5px 11px;
    cursor: pointer;
  }
  .reveal-btn:hover { color: var(--ink); border-color: var(--ink); }

  .answer {
    display: none;
    margin-top: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink);
    line-height: 1.6;
    text-align: left;
  }
  .answer .miss { color: var(--hard-dark); font-family: 'Karla', sans-serif; font-size: 0.72rem; }

  .num-card.revealed .answer { display: block; }
  .num-card.revealed .reveal-btn { display: none; }
  .num-card.exact { box-shadow: 0 1px 2px rgba(36,27,24,0.04), 0 0 0 2px var(--gold) inset; }

  @media (max-width: 560px) {
    .board { padding: 24px 16px 34px; }
  }
</style>
</head>
<body>

<div class="board">
  <a class="brand-lockup" href="../../../index.html">
    <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="18" fill="#ff4b3e"/>
      <rect x="26" y="6" width="12" height="8" rx="4" fill="#fff8f3"/>
      <circle cx="32" cy="35" r="19" fill="none" stroke="#fff8f3" stroke-width="4.5"/>
      <line x1="32" y1="35" x2="32" y2="23" stroke="#fff8f3" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="32" y1="35" x2="41" y2="35" stroke="#fff8f3" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
    <span class="brand-wordmark"><span class="a">Engaging</span> <span class="b">Starters</span></span>
  </a>
  <a class="back-link" href="../index.html">&larr; All activities</a>
  <header>
    <h1>Number of the Day</h1>
    <p>today's date, six digits, every number you can make</p>
  </header>

  <div class="panel">
    <div class="date-label" id="dateLabel"></div>
    <div class="tiles-row" id="tilesRow"></div>

    <div class="field">
      <label>How far to count</label>
      <div class="segmented" id="rangeToggle">
        <button type="button" data-max="10">1&ndash;10</button>
        <button type="button" data-max="20" class="active">1&ndash;20</button>
        <button type="button" data-max="30">1&ndash;30</button>
      </div>
    </div>
  </div>

  <div class="results">
    <div class="summary" id="summary"></div>
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <footer>Use +, −, ×, ÷ and brackets. Each of today's six digits can be used at most once — you don't have to use them all.</footer>
</div>

<script>
(function(){
  "use strict";

  function todaysDigits(){
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const yy = String(now.getFullYear()).slice(-2);
    const dateLabel = now.toLocaleDateString(undefined, { day:'numeric', month:'long', year:'numeric' });
    return { digits: (dd+mm+yy).split('').map(Number), dateLabel };
  }

  /* ---------------- live solver ----------------
     Same approach as Countdown Numbers: recursively combine any two
     remaining numbers with +, -, x, / (skipping trivial/non-integer/
     non-positive results), tracking the working. Every intermediate
     result is a valid "answer" - using all six digits isn't required.
     Stops early on an exact match. */
  function solveNumbers(nums, target){
    let best = null;
    let exact = false;

    function consider(value, steps){
      const diff = Math.abs(value - target);
      if(!best || diff < best.diff){ best = { value, diff, steps }; }
      if(diff === 0){ exact = true; }
    }

    function combine(list){
      if(exact) return;
      for(const item of list) consider(item.value, item.steps);
      for(let i=0;i<list.length && !exact;i++){
        for(let j=i+1;j<list.length && !exact;j++){
          const a = list[i], b = list[j];
          const rest = list.filter((_,k)=>k!==i && k!==j);
          const candidates = [];

          candidates.push({ value:a.value+b.value, line:`${a.value} + ${b.value} = ${a.value+b.value}` });
          if(a.value!==1 && b.value!==1){
            candidates.push({ value:a.value*b.value, line:`${a.value} × ${b.value} = ${a.value*b.value}` });
          }
          if(a.value>b.value){
            candidates.push({ value:a.value-b.value, line:`${a.value} − ${b.value} = ${a.value-b.value}` });
          } else if(b.value>a.value){
            candidates.push({ value:b.value-a.value, line:`${b.value} − ${a.value} = ${b.value-a.value}` });
          }
          if(b.value!==0 && b.value!==1 && a.value%b.value===0){
            candidates.push({ value:a.value/b.value, line:`${a.value} ÷ ${b.value} = ${a.value/b.value}` });
          }
          if(a.value!==0 && a.value!==1 && b.value%a.value===0){
            candidates.push({ value:b.value/a.value, line:`${b.value} ÷ ${a.value} = ${b.value/a.value}` });
          }

          for(const c of candidates){
            const node = { value:c.value, steps:a.steps.concat(b.steps).concat([c.line]) };
            combine(rest.concat([node]));
            if(exact) return;
          }
        }
      }
    }

    combine(nums.map(n=>({ value:n, steps:[] })));
    return best;
  }

  /* ---------------- UI wiring ---------------- */
  const dateLabel = document.getElementById('dateLabel');
  const tilesRow = document.getElementById('tilesRow');
  const rangeToggle = document.getElementById('rangeToggle');
  const summary = document.getElementById('summary');
  const cardGrid = document.getElementById('cardGrid');

  const today = todaysDigits();
  let maxN = 20;

  dateLabel.textContent = today.dateLabel;
  tilesRow.innerHTML = today.digits.map(n=>`<span class="tile">${n}</span>`).join('');

  function renderGrid(){
    summary.textContent = `Make every number from 1 to ${maxN}!`;
    cardGrid.innerHTML = '';
    for(let target=1; target<=maxN; target++){
      const card = document.createElement('div');
      card.className = 'num-card';
      card.innerHTML = `
        <div class="target">${target}</div>
        <button type="button" class="reveal-btn">Reveal answer</button>
        <div class="answer"></div>
      `;
      const answerBox = card.querySelector('.answer');
      card.querySelector('.reveal-btn').addEventListener('click', ()=>{
        const result = solveNumbers(today.digits, target);
        if(!result || result.diff!==0){
          const near = result ? ` Closest with today's digits: ${result.value}.` : '';
          answerBox.innerHTML = `<span class="miss">Not possible with today's digits.${near}</span>`;
        } else if(result.steps.length===0){
          answerBox.innerHTML = `Just use the digit <strong>${result.value}</strong> on its own.`;
          card.classList.add('exact');
        } else {
          answerBox.innerHTML = result.steps.join('<br/>');
          card.classList.add('exact');
        }
        card.classList.add('revealed');
      });
      cardGrid.appendChild(card);
    }
  }

  rangeToggle.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    Array.from(rangeToggle.children).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    maxN = Number(btn.dataset.max);
    renderGrid();
  });

  renderGrid();

})();
</script>

</body>
</html>
