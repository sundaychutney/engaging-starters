<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spot the Misleading Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css">
<link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<style>
  .board { max-width: 1040px; padding: 40px 32px 48px; }

  .panel {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 18px;
    max-width: 640px;
    margin: 0 auto;
    padding: 26px 28px 22px;
    position: relative;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
    text-align: center;
  }
  .field label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .segmented {
    display: inline-flex;
    justify-content: center;
    border: 1.5px solid var(--paper-line);
    border-radius: 6px;
    overflow: hidden;
  }
  .segmented button {
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 9px 18px;
    border: none;
    background: #fffdf7;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .segmented button + button { border-left: 1.5px solid var(--paper-line); }
  .segmented button.active { background: var(--ink); color: var(--paper); }

  .new-btn, .lock-btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 26px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .new-btn { display: block; margin: 18px auto 0; }
  .new-btn:hover, .lock-btn:hover { transform: translateY(-1px); }
  .lock-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .ghost-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: 1.3px dashed var(--ink-soft);
    border-radius: 8px;
    padding: 9px 20px;
    cursor: pointer;
  }
  .ghost-btn:hover { color: var(--ink); border-color: var(--ink); }

  /* ---- chart grid ---- */
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }

  .chart-card {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 18px 20px;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
    transition: border-color 0.15s ease;
  }
  .chart-card.is-correct { border-color: var(--science); }
  .chart-card.is-incorrect { border-color: var(--brand); }

  .chart-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .chart-num {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--ink-soft);
    width: 20px;
    flex-shrink: 0;
  }
  .chart-card h3 { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 1rem; margin: 0; }

  .claim-banner {
    background: rgba(255,75,62,0.1);
    color: var(--brand-dark);
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
  }

  .chart-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }

  .chart-svg-wrap svg { width: 100%; height: auto; display: block; }
  .chart-axis { stroke: var(--ink-soft); stroke-width: 1.5; }
  .chart-grid-line, .chart-svg-wrap .chart-grid { stroke: var(--paper-line); stroke-width: 1; }
  .chart-tick { font-family: 'Space Mono', monospace; font-size: 9px; fill: var(--ink-soft); }
  .chart-bar { opacity: 0.92; }
  .chart-line { fill: none; stroke-width: 2.6; }
  .chart-dot { stroke: var(--card); stroke-width: 1.5; }
  .chart-bubble { opacity: 0.85; stroke: var(--maths-dark); stroke-width: 1; }

  .answer-group { border: none; margin: 14px 0 0; padding: 0; }
  .answer-group legend {
    font-family: 'Karla', sans-serif;
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0;
    margin-bottom: 6px;
  }
  .opt-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Karla', sans-serif;
    font-size: 0.86rem;
  }
  .opt-row:hover { background: rgba(0,0,0,0.03); }
  .opt-row input { accent-color: var(--maths); flex-shrink: 0; }
  .opt-row.correct-answer { background: rgba(31,166,121,0.14); }
  .opt-row.wrong-answer { background: rgba(255,75,62,0.1); text-decoration: line-through; }

  .card-feedback { margin-top: 10px; font-family: 'Karla', sans-serif; font-size: 0.82rem; color: var(--ink-soft); min-height: 1px; }
  .card-feedback .tick { color: var(--science-dark); font-weight: 700; }
  .card-feedback .cross { color: var(--brand-dark); font-weight: 700; }

  .action-bar { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 30px; flex-wrap: wrap; }
  .answered-count { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--ink-soft); }

  .summary-banner {
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    padding: 14px 20px;
    border-radius: 14px;
    margin-top: 26px;
  }
  .summary-banner.pass { background: rgba(31,166,121,0.14); color: var(--science-dark); }
  .summary-banner.fail { background: rgba(232,145,43,0.16); color: var(--humanities-dark); }

  @media (max-width: 560px) {
    .board { padding: 28px 16px 40px; }
  }
</style>
</head>
<body>

<div class="board">
  <a class="brand-lockup" href="../../../index.html">
    <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="18" fill="#ff4b3e"/>
      <rect x="26" y="6" width="12" height="8" rx="4" fill="#fff8f3"/>
      <circle cx="32" cy="35" r="19" fill="none" stroke="#fff8f3" stroke-width="4.5"/>
      <line x1="32" y1="35" x2="32" y2="23" stroke="#fff8f3" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="32" y1="35" x2="41" y2="35" stroke="#fff8f3" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
    <span class="brand-wordmark"><span class="a">Engaging</span> <span class="b">Starters</span></span>
  </a>
  <a class="back-link" href="../index.html">&larr; All activities</a>
  <header>
    <h1>Spot the Misleading Graph</h1>
    <p>every graph tells a story &mdash; some are lying. can you tell which?</p>
  </header>

  <div class="panel" id="pickerPanel">
    <div class="field">
      <label>How many graphs?</label>
      <div class="segmented" id="countToggle">
        <button type="button" data-n="4">4</button>
        <button type="button" data-n="6" class="active">6</button>
        <button type="button" data-n="8">8</button>
        <button type="button" data-n="9">All 9</button>
      </div>
    </div>
    <button type="button" class="new-btn" id="startBtn">Start</button>
  </div>

  <div class="summary-banner" id="summaryBanner" style="display:none"></div>

  <div class="chart-grid" id="chartGrid"></div>

  <div class="action-bar" id="actionBar" style="display:none">
    <span class="answered-count" id="answeredCount"></span>
    <button type="button" class="lock-btn" id="checkBtn">Check answers</button>
    <button type="button" class="ghost-btn" id="newSetBtn" style="display:none">New set</button>
  </div>

  <footer>Every chart uses real (randomly generated) numbers &mdash; the trick, when there is one, is always in how it's drawn. Pick the reason that best explains each graph.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- helpers ---------------- */
  function rndInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
  function rnd(min, max){ return Math.random() * (max - min) + min; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = rndInt(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function niceMax(v){
    if(v <= 0) return 10;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const norm = v / mag;
    let n;
    if(norm <= 1) n = 1;
    else if(norm <= 2) n = 2;
    else if(norm <= 5) n = 5;
    else n = 10;
    return n * mag;
  }

  /* ---------------- chart canvas geometry ---------------- */
  const L = 46, R = 384, T = 14, B = 184, PW = R - L, PH = B - T;

  function frameSVG(){
    return `<line class="chart-axis" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/><line class="chart-axis" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/>`;
  }

  function yTicksSVG(yMin, yMax, yAt, count){
    count = count || 4;
    let s = '';
    for(let i = 0; i <= count; i++){
      const val = yMin + (yMax - yMin) * i / count;
      const yy = yAt(val);
      s += `<line class="chart-grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${R}" y2="${yy.toFixed(1)}"/>`;
      s += `<text class="chart-tick" x="${L - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${Math.round(val)}</text>`;
    }
    return s;
  }

  function xLabelsSVG(labels, xAt){
    return labels.map((lab, i) => `<text class="chart-tick" x="${xAt(i).toFixed(1)}" y="${B + 16}" text-anchor="middle">${lab}</text>`).join('');
  }

  function drawBars(categories, values, opts){
    opts = opts || {};
    const yMin = opts.yMin || 0;
    const yMax = opts.yMax != null ? opts.yMax : niceMax(Math.max.apply(null, values) * 1.15);
    const color = opts.color || 'var(--maths)';
    const yAt = v => B - (v - yMin) / (yMax - yMin) * PH;
    const n = categories.length;
    const slot = PW / n;
    let s = frameSVG() + yTicksSVG(yMin, yMax, yAt);
    categories.forEach((cat, i) => {
      const val = values[i];
      const wf = opts.widthFactors ? opts.widthFactors[i] : 1;
      const w = slot * 0.55 * wf;
      const cx = L + slot * (i + 0.5);
      const yv = yAt(val);
      s += `<rect class="chart-bar" x="${(cx - w / 2).toFixed(1)}" y="${yv.toFixed(1)}" width="${w.toFixed(1)}" height="${(B - yv).toFixed(1)}" style="fill:${color}"/>`;
    });
    s += xLabelsSVG(categories, i => L + slot * (i + 0.5));
    return s;
  }

  function drawLine(labels, values, opts){
    opts = opts || {};
    const yMin = opts.yMin || 0;
    const yMax = opts.yMax != null ? opts.yMax : niceMax(Math.max.apply(null, values) * 1.15);
    const color = opts.color || 'var(--maths)';
    const invert = !!opts.invert;
    const n = labels.length;
    const xAt = i => opts.xPositions ? L + opts.xPositions[i] * PW : L + PW * i / (n - 1);
    const yAt = v => invert ? T + (v - yMin) / (yMax - yMin) * PH : B - (v - yMin) / (yMax - yMin) * PH;
    let s = frameSVG() + yTicksSVG(yMin, yMax, yAt);
    const pts = values.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
    s += `<polyline class="chart-line" points="${pts}" style="stroke:${color}"/>`;
    values.forEach((v, i) => { s += `<circle class="chart-dot" cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="3.6" style="fill:${color}"/>`; });
    s += xLabelsSVG(labels, xAt);
    return s;
  }

  function drawDualAxis(labels, seriesA, seriesB, colorA, colorB){
    const maxA = niceMax(Math.max.apply(null, seriesA) * 1.15);
    const maxB = niceMax(Math.max.apply(null, seriesB) * 1.15);
    const n = labels.length;
    const xAt = i => L + PW * i / (n - 1);
    const yAtA = v => B - v / maxA * PH;
    const yAtB = v => B - v / maxB * PH;
    let s = frameSVG();
    s += `<line class="chart-axis" x1="${R}" y1="${T}" x2="${R}" y2="${B}"/>`;
    for(let i = 0; i <= 4; i++){
      const va = maxA * i / 4, vb = maxB * i / 4;
      const yy = B - PH * i / 4;
      s += `<text class="chart-tick" x="${L - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end" style="fill:${colorA}">${Math.round(va)}</text>`;
      s += `<text class="chart-tick" x="${R + 6}" y="${(yy + 3).toFixed(1)}" text-anchor="start" style="fill:${colorB}">${Math.round(vb)}</text>`;
    }
    const ptsA = seriesA.map((v, i) => `${xAt(i).toFixed(1)},${yAtA(v).toFixed(1)}`).join(' ');
    const ptsB = seriesB.map((v, i) => `${xAt(i).toFixed(1)},${yAtB(v).toFixed(1)}`).join(' ');
    s += `<polyline class="chart-line" points="${ptsA}" style="stroke:${colorA}"/>`;
    s += `<polyline class="chart-line" points="${ptsB}" style="stroke:${colorB};stroke-dasharray:5,4"/>`;
    seriesA.forEach((v, i) => { s += `<circle class="chart-dot" cx="${xAt(i).toFixed(1)}" cy="${yAtA(v).toFixed(1)}" r="3.4" style="fill:${colorA}"/>`; });
    seriesB.forEach((v, i) => { s += `<circle class="chart-dot" cx="${xAt(i).toFixed(1)}" cy="${yAtB(v).toFixed(1)}" r="3.4" style="fill:${colorB}"/>`; });
    s += xLabelsSVG(labels, xAt);
    return s;
  }

  function drawBrokenBars(categories, values, breakLow, breakHigh){
    const yMax = niceMax(Math.max.apply(null, values) * 1.08);
    const gap = 16;
    const lowSpan = breakLow, highSpan = yMax - breakHigh;
    const usable = PH - gap;
    const lowPx = usable * lowSpan / (lowSpan + highSpan);
    const yAt = v => v <= breakLow ? B - (v / lowSpan) * lowPx : B - lowPx - gap - ((v - breakHigh) / highSpan) * (usable - lowPx);
    const n = categories.length, slot = PW / n;
    let s = frameSVG();
    [0, breakLow * 0.5, breakLow].forEach(v => {
      const yy = yAt(v);
      s += `<line class="chart-grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${R}" y2="${yy.toFixed(1)}"/><text class="chart-tick" x="${L - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
    });
    [breakHigh, (breakHigh + yMax) / 2, yMax].forEach(v => {
      const yy = yAt(v);
      s += `<line class="chart-grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${R}" y2="${yy.toFixed(1)}"/><text class="chart-tick" x="${L - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
    });
    const zy = B - lowPx - gap / 2;
    s += `<path class="chart-axis" d="M ${L - 4} ${(zy + 5).toFixed(1)} L ${L + 3} ${(zy - 5).toFixed(1)} L ${L - 3} ${(zy + 2).toFixed(1)} L ${L + 4} ${(zy - 8).toFixed(1)}" fill="none"/>`;
    categories.forEach((cat, i) => {
      const val = values[i];
      const w = slot * 0.55;
      const cx = L + slot * (i + 0.5);
      const yv = yAt(val);
      s += `<rect class="chart-bar" x="${(cx - w / 2).toFixed(1)}" y="${yv.toFixed(1)}" width="${w.toFixed(1)}" height="${(B - yv).toFixed(1)}" style="fill:var(--maths)"/>`;
    });
    s += xLabelsSVG(categories, i => L + slot * (i + 0.5));
    return s;
  }

  function drawBubbles(categories, values){
    const maxV = Math.max.apply(null, values);
    const maxR = 58;
    const cy = 90;
    const n = categories.length;
    const cxFor = i => L + PW * (i + 0.5) / n;
    let s = '';
    categories.forEach((cat, i) => {
      const v = values[i];
      const r = 12 + (v / maxV) * maxR;
      const cx = cxFor(i);
      s += `<circle class="chart-bubble" cx="${cx.toFixed(1)}" cy="${cy}" r="${r.toFixed(1)}" style="fill:var(--maths)"/>`;
      s += `<text class="chart-tick" x="${cx.toFixed(1)}" y="${(cy + 4).toFixed(1)}" text-anchor="middle" style="fill:#fff;font-weight:700">${v}</text>`;
      s += `<text class="chart-tick" x="${cx.toFixed(1)}" y="${(cy + maxR + 22).toFixed(1)}" text-anchor="middle">${cat}</text>`;
    });
    return s;
  }

  /* ---------------- technique builders ---------------- */
  function buildTruncatedAxis(){
    const categories = ['7A', '7B', '7C', '7D'];
    const base = rndInt(70, 82);
    const values = categories.map(() => base + rndInt(-6, 6));
    const yMin = Math.max(0, Math.min.apply(null, values) - 3);
    const yMax = Math.min(100, Math.max.apply(null, values) + 3);
    return { title: 'Average test score by class (%)', svg: drawBars(categories, values, { yMin, yMax }) };
  }

  function buildBrokenAxis(){
    const categories = ['Room 4', 'Room 7', 'Room 12', 'Room 9'];
    const small = [rndInt(35, 55), rndInt(35, 55), rndInt(30, 50)];
    const big = rndInt(350, 450);
    const values = shuffle([...small, big]);
    return { title: 'Money raised for the fundraiser ($)', svg: drawBrokenBars(categories, values, 60, 300) };
  }

  function buildUnevenIntervals(){
    const labels = ['2015', '2016', '2017', '2018', '2023'];
    let v = rndInt(100, 140);
    const values = [v];
    for(let i = 1; i < 4; i++){ v += rndInt(20, 40); values.push(v); }
    v += rndInt(150, 220); values.push(v);
    return { title: 'Library books borrowed per year', svg: drawLine(labels, values, { yMin: 0, xPositions: [0, 0.25, 0.5, 0.75, 1] }) };
  }

  function buildDualAxis(){
    const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
    let a = rndInt(10, 30), b = rndInt(1, 3);
    const seriesA = [a], seriesB = [b];
    for(let i = 1; i < 6; i++){
      a = Math.max(5, a + rndInt(-6, 16));
      b = Math.max(0, b + rndInt(-1, 3));
      seriesA.push(a); seriesB.push(b);
    }
    return {
      title: 'Ice-cream sales vs shark attacks (by month)',
      legend: `<span class="legend-item" style="color:var(--maths)">&#9679; Ice-cream sales ($100s) &mdash; left axis</span><span class="legend-item" style="color:var(--brand)">&#9679; Shark attacks reported &mdash; right axis</span>`,
      svg: drawDualAxis(labels, seriesA, seriesB, 'var(--maths)', 'var(--brand)')
    };
  }

  function buildInvertedAxis(){
    const labels = ['Term 1', 'Term 2', 'Term 3', 'Term 4'];
    let v = rndInt(32, 42);
    const values = [v];
    for(let i = 1; i < 4; i++){ v = Math.max(4, v - rndInt(6, 12)); values.push(v); }
    const yMax = niceMax(Math.max.apply(null, values) * 1.15);
    return { title: 'Student absences per term', svg: drawLine(labels, values, { yMin: 0, yMax, invert: true }) };
  }

  function buildAreaDistortion(){
    const categories = ['Northside', 'Eastview', 'Central'];
    const base = Math.round(rndInt(400, 700) / 10) * 10;
    const values = [base, base * 2, base * 4];
    return { title: 'Trees planted by three schools', svg: drawBubbles(categories, values) };
  }

  function buildUnevenBarWidth(){
    const categories = ['Zara', 'Kai', 'Priya', 'Leo'];
    const values = categories.map(() => rndInt(15, 35));
    const maxV = Math.max.apply(null, values);
    const widthFactors = values.map(v => 0.65 + (v / maxV) * 0.75);
    return { title: 'Votes for class captain', svg: drawBars(categories, values, { yMin: 0, widthFactors }) };
  }

  function buildCherryPicked(){
    const labels = ['Wk 9', 'Wk 10', 'Wk 11', 'Wk 12'];
    let v = rndInt(900, 1400);
    const values = [v];
    for(let i = 1; i < 4; i++){ v = Math.round(v * rnd(1.2, 1.5)); values.push(v); }
    const pct = Math.round((values[3] / values[0] - 1) * 100);
    return {
      title: 'Weekly revenue ($)',
      note: `📈 Revenue up ${pct}% this quarter!`,
      svg: drawLine(labels, values, { yMin: 0 })
    };
  }

  function buildFair(){
    if(Math.random() < 0.5){
      const categories = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
      const values = categories.map(() => rndInt(2, 7));
      return { title: 'Average screen time on school nights (hrs)', svg: drawBars(categories, values, { yMin: 0 }) };
    }
    const categories = ['Jan', 'Feb', 'Mar', 'Apr', 'May'];
    const values = categories.map(() => rndInt(40, 90));
    return { title: 'Monthly rainfall (mm)', svg: drawLine(categories, values, { yMin: 0 }) };
  }

  /* ---------------- technique pool ---------------- */
  const POOL = [
    { id: 'truncated-axis', label: "Y-axis doesn't start at zero", explain: "Because the axis starts near the data instead of zero, small real differences look huge.", build: buildTruncatedAxis },
    { id: 'broken-axis', label: 'A broken axis hides part of the scale', explain: "The zig-zag skips a big range of values, so the tall bar looks only slightly bigger than it really is.", build: buildBrokenAxis },
    { id: 'uneven-intervals', label: 'X-axis intervals are uneven but spaced equally', explain: "2018 to 2023 is a five-year gap plotted the same width as the one-year gaps, so the last jump looks like normal yearly growth.", build: buildUnevenIntervals },
    { id: 'dual-axis', label: 'Two mismatched y-axes exaggerate a link', explain: "Each line has its own independently-scaled axis, so lining them up visually suggests a connection the numbers don't actually support.", build: buildDualAxis },
    { id: 'inverted-axis', label: 'The y-axis is flipped upside down', explain: "Zero is at the top and the biggest number is at the bottom, so a falling trend is drawn as a rising line.", build: buildInvertedAxis },
    { id: 'area-distortion', label: 'Circle size is scaled by radius, not area', explain: "The circles are sized by radius instead of area, so doubling a value makes the circle look roughly four times bigger.", build: buildAreaDistortion },
    { id: 'uneven-bar-width', label: 'Bars vary in width as well as height', explain: "Wider bars for bigger values add a second exaggeration on top of the height difference.", build: buildUnevenBarWidth },
    { id: 'cherry-picked', label: 'Only a cherry-picked slice of time is shown', explain: "Only four hand-picked weeks are shown, and the headline claims a full quarter of growth.", build: buildCherryPicked },
    { id: 'fair', label: 'This graph is fair &mdash; nothing misleading', explain: "Zero baseline, even spacing, one axis, no tricks &mdash; this one's straightforward.", build: buildFair }
  ];

  function newRoundSet(n){
    const fair = POOL.find(p => p.id === 'fair');
    const flaws = shuffle(POOL.filter(p => p.id !== 'fair'));
    const chosenDefs = shuffle([fair, ...flaws.slice(0, n - 1)]);
    return chosenDefs.map(def => {
      const built = def.build();
      return { id: def.id, label: def.label, explain: def.explain, title: built.title, note: built.note || null, legend: built.legend || null, svg: built.svg };
    });
  }

  function buildOptions(correctId){
    const correct = POOL.find(p => p.id === correctId);
    const others = shuffle(POOL.filter(p => p.id !== correctId)).slice(0, 3);
    return shuffle([correct, ...others]);
  }

  function renderCard(card, idx){
    const options = buildOptions(card.id);
    return `
      <div class="chart-card" data-idx="${idx}">
        <div class="chart-card-head"><span class="chart-num">${idx + 1}</span><h3>${card.title}</h3></div>
        ${card.legend ? `<div class="chart-legend">${card.legend}</div>` : ''}
        ${card.note ? `<div class="claim-banner">${card.note}</div>` : ''}
        <div class="chart-svg-wrap"><svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg">${card.svg}</svg></div>
        <fieldset class="answer-group">
          <legend>What's going on here?</legend>
          ${options.map(opt => `
            <label class="opt-row">
              <input type="radio" name="q${idx}" value="${opt.id}">
              <span>${opt.label}</span>
            </label>`).join('')}
        </fieldset>
        <div class="card-feedback"></div>
      </div>`;
  }

  /* ---------------- game flow ---------------- */
  let roundCount = 6;
  let currentSet = [];

  const countToggle = document.getElementById('countToggle');
  const startBtn = document.getElementById('startBtn');
  const chartGrid = document.getElementById('chartGrid');
  const actionBar = document.getElementById('actionBar');
  const checkBtn = document.getElementById('checkBtn');
  const newSetBtn = document.getElementById('newSetBtn');
  const answeredCount = document.getElementById('answeredCount');
  const summaryBanner = document.getElementById('summaryBanner');

  countToggle.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    Array.from(countToggle.children).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    roundCount = Number(btn.dataset.n);
  });

  function startGame(){
    currentSet = newRoundSet(roundCount);
    chartGrid.innerHTML = currentSet.map((card, idx) => renderCard(card, idx)).join('');
    actionBar.style.display = 'flex';
    checkBtn.style.display = 'inline-flex';
    checkBtn.disabled = true;
    newSetBtn.style.display = 'none';
    summaryBanner.style.display = 'none';
    updateAnsweredCount();
    chartGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function updateAnsweredCount(){
    let answered = 0;
    currentSet.forEach((c, idx) => { if(document.querySelector(`input[name="q${idx}"]:checked`)) answered++; });
    answeredCount.textContent = `${answered} of ${currentSet.length} answered`;
    checkBtn.disabled = answered < currentSet.length;
  }

  function checkAnswers(){
    let correctCount = 0;
    currentSet.forEach((card, idx) => {
      const chosen = document.querySelector(`input[name="q${idx}"]:checked`);
      const cardEl = chartGrid.querySelector(`.chart-card[data-idx="${idx}"]`);
      const fb = cardEl.querySelector('.card-feedback');
      cardEl.querySelectorAll('input[type=radio]').forEach(r => { r.disabled = true; });
      const isCorrect = !!chosen && chosen.value === card.id;
      if(isCorrect) correctCount++;
      cardEl.classList.add(isCorrect ? 'is-correct' : 'is-incorrect');
      const correctRow = cardEl.querySelector(`input[value="${card.id}"]`).closest('.opt-row');
      correctRow.classList.add('correct-answer');
      if(chosen && !isCorrect) chosen.closest('.opt-row').classList.add('wrong-answer');
      fb.innerHTML = isCorrect
        ? `<span class="tick">&check; Correct.</span> ${card.explain}`
        : `<span class="cross">&cross; Not quite.</span> ${card.explain}`;
    });
    showSummary(correctCount, currentSet.length);
    checkBtn.style.display = 'none';
    newSetBtn.style.display = 'inline-flex';
  }

  function showSummary(correct, total){
    const pct = Math.round((correct / total) * 100);
    let msg, cls;
    if(correct === total){ msg = `Perfect! You spotted all ${total} — sharp eyes.`; cls = 'pass'; }
    else if(pct >= 70){ msg = `Pass — ${correct} of ${total} correct. Solid graph literacy.`; cls = 'pass'; }
    else { msg = `${correct} of ${total} correct. Keep practising — read the axes carefully next time.`; cls = 'fail'; }
    summaryBanner.textContent = msg;
    summaryBanner.className = `summary-banner ${cls}`;
    summaryBanner.style.display = 'block';
    summaryBanner.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  startBtn.addEventListener('click', startGame);
  newSetBtn.addEventListener('click', startGame);
  checkBtn.addEventListener('click', checkAnswers);
  chartGrid.addEventListener('change', e => {
    if(e.target.matches('input[type=radio]')) updateAnsweredCount();
  });

})();
</script>

</body>
</html>
