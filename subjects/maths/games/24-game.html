<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Make 24 — Puzzle Set Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css">
<link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<style>
  .board { max-width: 1080px; }

  .panel {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 18px;
    max-width: 640px;
    margin: 0 auto;
    padding: 26px 28px 22px;
    position: relative;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
  }

  .field-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .field input[type="number"] {
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-size: 1.15rem;
    padding: 8px 10px;
    border: 1.5px solid var(--paper-line);
    border-radius: 6px;
    background: #fffdf7;
    color: var(--ink);
  }
  .field input[type="number"]:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(143,184,214,0.3);
  }

  .field.total input { border-color: var(--ink-soft); font-weight: 700; }
  .field.easy label { color: var(--easy-dark); }
  .field.medium label { color: var(--medium-dark); }
  .field.hard label { color: var(--hard-dark); }

  .range-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .range-row > span {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .segmented {
    display: inline-flex;
    border: 1.5px solid var(--paper-line);
    border-radius: 6px;
    overflow: hidden;
  }
  .segmented button {
    font-family: 'Karla', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 14px;
    border: none;
    background: #fffdf7;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .segmented button + button { border-left: 1.5px solid var(--paper-line); }
  .segmented button.active { background: var(--ink); color: var(--paper); }

  .helper-msg {
    font-size: 0.85rem;
    color: var(--ink-soft);
    min-height: 20px;
    margin-bottom: 12px;
  }
  .helper-msg.error { color: var(--hard-dark); font-weight: 600; }

  .generate-btn {
    width: 100%;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .generate-btn:hover { transform: translateY(-1px); }
  .generate-btn:disabled { opacity: 0.6; cursor: wait; }

  /* ---- results ---- */
  .results { margin-top: 40px; }
  .results.hidden { display: none; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    color: var(--chalk-dim);
    font-size: 0.9rem;
  }

  .toolbar .summary { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 1.1rem; color: var(--ink); }

  .toolbar-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .toolbar-actions label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  .ghost-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 13px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .ghost-btn:hover { background: rgba(36,27,24,0.05); }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 22px;
  }

  .puzzle-card {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px 16px;
    position: relative;
    box-shadow: 0 1px 2px rgba(36,27,24,0.04);
  }

  .puzzle-idx {
    position: absolute;
    top: 16px; left: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .diff-tag {
    position: absolute;
    top: 14px; right: 14px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 999px;
  }
  .diff-tag.easy { background: rgba(31,166,121,0.14); color: var(--easy-dark); }
  .diff-tag.medium { background: rgba(232,145,43,0.16); color: var(--medium-dark); }
  .diff-tag.hard { background: rgba(255,75,62,0.14); color: var(--hard-dark); }

  .numbers-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 30px 0 8px;
    flex-wrap: wrap;
  }

  .num-pip {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1.7rem;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--ink);
    border-radius: 8px;
    background: #fffefa;
  }

  .sol-count {
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .reveal-btn {
    display: block;
    margin: 4px auto 0;
    font-family: 'Karla', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: 1.3px dashed var(--ink-soft);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .reveal-btn:hover { color: var(--ink); border-color: var(--ink); }

  .answer {
    display: none;
    margin-top: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    text-align: center;
    color: var(--ink);
    line-height: 1.5;
    word-break: break-word;
  }
  .answer .more { display: block; color: var(--ink-soft); font-size: 0.72rem; margin-top: 2px; }

  .puzzle-card.revealed .answer { display: block; }
  .puzzle-card.revealed .reveal-btn { display: none; }

  @media (max-width: 560px) {
    .field-row { grid-template-columns: 1fr 1fr; }
    .board { padding: 24px 16px 34px; }
  }

  /* ---- print ---- */
  @media print {
    body { background: #fff; padding: 0; }
    .board { border: none; box-shadow: none; padding: 0; background: #fff; }
    header, .panel, .toolbar { display: none; }
    .card-grid { gap: 14px; }
    .puzzle-card { box-shadow: none; border: 1px solid #999; break-inside: avoid; }
    .reveal-btn { display: none; }
    .answer { display: none; }
    body.print-with-answers .answer { display: block; }
    footer { display: none; }
  }
</style>
</head>
<body>

<div class="board">
  <a class="brand-lockup" href="../../../index.html">
    <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="18" fill="#ff4b3e"/>
      <rect x="26" y="6" width="12" height="8" rx="4" fill="#fff8f3"/>
      <circle cx="32" cy="35" r="19" fill="none" stroke="#fff8f3" stroke-width="4.5"/>
      <line x1="32" y1="35" x2="32" y2="23" stroke="#fff8f3" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="32" y1="35" x2="41" y2="35" stroke="#fff8f3" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
    <span class="brand-wordmark"><span class="a">Engaging</span> <span class="b">Starters</span></span>
  </a>
  <a class="back-link" href="../index.html">&larr; All activities</a>
  <header>
    <h1>Make <span class="num24">24</span></h1>
    <p>puzzle set generator — four numbers, one target, endless arguments</p>
  </header>

  <form class="panel" id="genForm">
    <div class="field-row">
      <div class="field total">
        <label for="fSets">Number of sets</label>
        <input type="number" id="fSets" min="1" max="60" value="6" required />
      </div>
      <div class="field easy">
        <label for="fEasy">Easy</label>
        <input type="number" id="fEasy" min="0" max="60" value="2" required />
      </div>
      <div class="field medium">
        <label for="fMedium">Medium</label>
        <input type="number" id="fMedium" min="0" max="60" value="2" required />
      </div>
      <div class="field hard">
        <label for="fHard">Hard</label>
        <input type="number" id="fHard" min="0" max="60" value="2" required />
      </div>
    </div>

    <div class="range-row">
      <span>Number range</span>
      <div class="segmented" id="rangeToggle">
        <button type="button" data-lo="1" data-hi="9" class="active">1 – 9</button>
        <button type="button" data-lo="1" data-hi="13">1 – 13 (face cards)</button>
      </div>
    </div>

    <div class="helper-msg" id="helperMsg">The remaining sets will be a random mix of difficulties.</div>

    <button type="submit" class="generate-btn" id="genBtn">Deal the cards</button>
  </form>

  <div class="results hidden" id="results">
    <div class="toolbar">
      <div class="summary" id="resultsSummary"></div>
      <div class="toolbar-actions">
        <button type="button" class="ghost-btn" id="toggleAllBtn">Reveal all answers</button>
        <label><input type="checkbox" id="printAnswersChk" /> Include answers when printing</label>
        <button type="button" class="ghost-btn" id="printBtn">Print worksheet</button>
      </div>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <footer>Use +, −, ×, ÷ and all four numbers, in any order, to make 24.</footer>
</div>

<script>
(function(){

  const PUZZLE_DB = {"1-9":[{"n":[1,1,1,8],"c":1,"s":["(((1 + 1) + 1) * 8)"],"d":"hard"},{"n":[1,1,2,6],"c":5,"s":["(((1 + 1) + 2) * 6)","(((1 + 1) * 2) * 6)","(((1 + 1) * 6) * 2)"],"d":"medium"},{"n":[1,1,2,7],"c":1,"s":["((1 + 7) * (1 + 2))"],"d":"hard"},{"n":[1,1,2,8],"c":12,"s":["(((1 * 1) + 2) * 8)","(((1 / 1) + 2) * 8)","(((1 + 2) * 1) * 8)"],"d":"easy"},{"n":[1,1,2,9],"c":1,"s":["((9 - 1) * (1 + 2))"],"d":"hard"},{"n":[1,1,3,4],"c":3,"s":["(((1 + 1) * 3) * 4)","(((1 + 1) * 4) * 3)","((3 * 4) * (1 + 1))"],"d":"hard"},{"n":[1,1,3,5],"c":1,"s":["((1 + 5) * (1 + 3))"],"d":"hard"},{"n":[1,1,3,6],"c":14,"s":["(((1 + 1) + 6) * 3)","(((1 * 1) + 3) * 6)","(((1 / 1) + 3) * 6)"],"d":"easy"},{"n":[1,1,3,7],"c":13,"s":["(((1 * 1) + 7) * 3)","(((1 / 1) + 7) * 3)","((7 - 1) * (1 + 3))"],"d":"easy"},{"n":[1,1,3,8],"c":76,"s":["(((1 * 1) * 3) * 8)","(8 / ((1 * 1) / 3))","((3 / (1 * 1)) * 8)"],"d":"easy"},{"n":[1,1,3,9],"c":13,"s":["((3 + 9) * (1 + 1))","((9 - (1 * 1)) * 3)","((9 - (1 / 1)) * 3)"],"d":"easy"},{"n":[1,1,4,4],"c":2,"s":["(((1 + 1) + 4) * 4)","(((1 + 4) + 1) * 4)"],"d":"hard"},{"n":[1,1,4,5],"c":13,"s":["(((1 * 1) + 5) * 4)","(((1 / 1) + 5) * 4)","(((1 + 4) * 5) - 1)"],"d":"easy"},{"n":[1,1,4,6],"c":76,"s":["(((1 * 1) * 4) * 6)","(6 / ((1 * 1) / 4))","((4 / (1 * 1)) * 6)"],"d":"easy"},{"n":[1,1,4,7],"c":13,"s":["((7 - (1 * 1)) * 4)","((7 - (1 / 1)) * 4)","((7 - 1) * (1 * 4))"],"d":"easy"},{"n":[1,1,4,8],"c":15,"s":["((8 - (1 + 1)) * 4)","((4 + 8) * (1 + 1))","((4 - (1 * 1)) * 8)"],"d":"easy"},{"n":[1,1,4,9],"c":2,"s":["((1 - 9) * (1 - 4))","((9 - 1) * (4 - 1))"],"d":"hard"},{"n":[1,1,5,5],"c":10,"s":["((5 * 5) - (1 * 1))","((5 * 5) - (1 / 1))","((5 - 1) * (1 + 5))"],"d":"medium"},{"n":[1,1,5,6],"c":13,"s":["((5 - (1 * 1)) * 6)","((5 - (1 / 1)) * 6)","(((1 * 5) - 1) * 6)"],"d":"easy"},{"n":[1,1,5,7],"c":3,"s":["((5 + 7) * (1 + 1))","((1 - 7) * (1 - 5))","((7 - 1) * (5 - 1))"],"d":"hard"},{"n":[1,1,5,8],"c":2,"s":["((5 - (1 + 1)) * 8)","(((5 - 1) - 1) * 8)"],"d":"h   function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function poolsFor(lo,hi){
    const key = `${lo}-${hi}`;
    const all = PUZZLE_DB[key] || [];
    return {
      easy: shuffle(all.filter(e=>e.d==='easy').slice()),
      medium: shuffle(all.filter(e=>e.d==='medium').slice()),
      hard: shuffle(all.filter(e=>e.d==='hard').slice()),
      any: shuffle(all.slice())
    };
  }

  function toDisplay(entry){
    return { numbers: shuffle(entry.n.slice()), solutions: entry.s, difficulty: entry.d, count: entry.c };
  }

  function generateBatch(total,easy,medium,hard,lo,hi){
    const pools = poolsFor(lo,hi);
    const usedKeys = new Set();
    const list = [];

    function take(pool){
      while(pool.length){
        const item = pool.pop();
        const k = item.n.join(',');
        if(usedKeys.has(k)) continue;
        usedKeys.add(k);
        return item;
      }
      return null;
    }

    for(let i=0;i<easy;i++){ const p=take(pools.easy); if(p) list.push(toDisplay(p)); }
    for(let i=0;i<medium;i++){ const p=take(pools.medium); if(p) list.push(toDisplay(p)); }
    for(let i=0;i<hard;i++){ const p=take(pools.hard); if(p) list.push(toDisplay(p)); }
    const remainder = Math.max(0, total - list.length);
    for(let i=0;i<remainder;i++){ const p=take(pools.any); if(p) list.push(toDisplay(p)); }

    return { list: shuffle(list), shortBy: total - list.length };
  }

  /* ---------------- UI wiring ---------------- */
  const fSets = document.getElementById('fSets');
  const fEasy = document.getElementById('fEasy');
  const fMedium = document.getElementById('fMedium');
  const fHard = document.getElementById('fHard');
  const helperMsg = document.getElementById('helperMsg');
  const genBtn = document.getElementById('genBtn');
  const genForm = document.getElementById('genForm');
  const results = document.getElementById('results');
  const resultsSummary = document.getElementById('resultsSummary');
  const cardGrid = document.getElementById('cardGrid');
  const rangeToggle = document.getElementById('rangeToggle');
  const toggleAllBtn = document.getElementById('toggleAllBtn');
  const printBtn = document.getElementById('printBtn');
  const printAnswersChk = document.getElementById('printAnswersChk');

  let range = { lo:1, hi:9 };
  rangeToggle.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    Array.from(rangeToggle.children).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    range = { lo: Number(btn.dataset.lo), hi: Number(btn.dataset.hi) };
  });

  function validate(){
    const total = Number(fSets.value)||0;
    const e = Number(fEasy.value)||0;
    const m = Number(fMedium.value)||0;
    const h = Number(fHard.value)||0;
    const sum = e+m+h;
    if(total<1){ helperMsg.textContent = 'Enter at least 1 set.'; helperMsg.classList.add('error'); return false; }
    if(sum>total){ helperMsg.textContent = `Easy + medium + hard (${sum}) can't exceed the number of sets (${total}).`; helperMsg.classList.add('error'); return false; }
    const remainder = total-sum;
    helperMsg.classList.remove('error');
    helperMsg.textContent = remainder>0
      ? `${remainder} of the ${total} sets will be a random mix of difficulties.`
      : `All ${total} sets are spoken for.`;
    return true;
  }
  [fSets,fEasy,fMedium,fHard].forEach(el=>el.addEventListener('input', validate));
  validate();

  function renderCards(list){
    cardGrid.innerHTML = '';
    list.forEach((p, idx)=>{
      const card = document.createElement('div');
      card.className = 'puzzle-card';
      const shownSolutions = p.solutions.slice(0,2);
      const extra = p.count - shownSolutions.length;
      card.innerHTML = `
        <span class="puzzle-idx">#${idx+1}</span>
        <span class="diff-tag ${p.difficulty}">${p.difficulty}</span>
        <div class="numbers-row">
          ${p.numbers.map(n=>`<span class="num-pip">${n}</span>`).join('')}
        </div>
        <div class="sol-count">${p.count} way${p.count===1?'':'s'} to make 24</div>
        <button type="button" class="reveal-btn">Reveal answer</button>
        <div class="answer">
          ${shownSolutions.map(s=>`<span>${s} = 24</span>`).join('<br/>')}
          ${extra>0 ? `<span class="more">+ ${extra} more way${extra===1?'':'s'}</span>` : ''}
        </div>
      `;
      card.querySelector('.reveal-btn').addEventListener('click', ()=>{
        card.classList.add('revealed');
      });
      cardGrid.appendChild(card);
    });
  }

  genForm.addEventListener('submit', function(ev){
    ev.preventDefault();
    if(!validate()) return;
    const total = Number(fSets.value);
    const e = Number(fEasy.value);
    const m = Number(fMedium.value);
    const h = Number(fHard.value);

    genBtn.disabled = true;
    genBtn.textContent = 'Shuffling…';
    results.classList.add('hidden');

    setTimeout(function(){
      const { list, shortBy } = generateBatch(total,e,m,h,range.lo,range.hi);
      renderCards(list);
      let summary = `${list.length} puzzle${list.length===1?'':'s'} · numbers ${range.lo}–${range.hi}`;
      if(shortBy>0){
        summary += ` · only ${list.length} unique combinations were available for this range/difficulty mix`;
      }
      resultsSummary.textContent = summary;
      results.classList.remove('hidden');
      genBtn.disabled = false;
      genBtn.textContent = 'Deal the cards';
      results.scrollIntoView({ behavior:'smooth', block:'start' });
    }, 20);
  });

  toggleAllBtn.addEventListener('click', function(){
    const cards = Array.from(cardGrid.querySelectorAll('.puzzle-card'));
    const anyHidden = cards.some(c=>!c.classList.contains('revealed'));
    cards.forEach(c=>c.classList.toggle('revealed', anyHidden));
    toggleAllBtn.textContent = anyHidden ? 'Hide all answers' : 'Reveal all answers';
  });

  printBtn.addEventListener('click', function(){
    document.body.classList.toggle('print-with-answers', printAnswersChk.checked);
    window.print();
  });

  // generate an initial set on load so the page isn't empty
  genForm.dispatchEvent(new Event('submit'));
})();
